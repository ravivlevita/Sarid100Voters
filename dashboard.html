<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sarid100Voter – דשבורד</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    direction: rtl; font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; color: #fff;
    background: linear-gradient(145deg, #0d3d3d 0%, #0a2e3d 50%, #0d3347 100%); min-height: 100vh; padding: 14px;
  }
  main { max-width: 900px; margin: 0 auto; }
  .top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .top img { width: 64px; }
  .top h1 { font-size: 20px; flex: 1; }
  .top a { color: rgba(255,255,255,.7); font-size: 13px; text-decoration: none; border: 1px solid rgba(255,255,255,.25); border-radius: 10px; padding: 6px 12px; }
  .card { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
  .big { text-align: center; }
  .big .num { font-size: 44px; font-weight: 800; }
  .big .of { font-size: 15px; color: rgba(255,255,255,.65); }
  .barwrap { position: relative; margin-top: 12px; padding-bottom: 24px; }
  .bar { height: 14px; background: rgba(255,255,255,.12); border-radius: 8px; overflow: hidden; }
  .bar > div { height: 100%; background: #22c55e; width: 0; transition: width .5s; }
  .mark { position: absolute; top: -5px; height: 24px; width: 3px; margin-right: -1px; background: #f59e0b; border-radius: 2px; }
  .marklbl { position: absolute; top: 22px; font-size: 12px; font-weight: 700; color: #f59e0b; transform: translateX(50%); white-space: nowrap; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  .kpi { text-align: center; }
  .kpi .v { font-size: 28px; font-weight: 800; }
  .kpi .l { font-size: 13px; color: rgba(255,255,255,.65); margin-top: 2px; }
  .chartbox { position: relative; height: 340px; direction: ltr; }
  #upd { font-size: 12px; color: rgba(255,255,255,.45); text-align: center; margin-top: 6px; }
  #err { color: #fca5a5; text-align: center; min-height: 18px; font-size: 14px; }
</style>
</head>
<body>
<main>
  <div class="top">
    <img src="https://konenutsarid.github.io/SaridEmergencyForms/Sarid100Logo.png" alt="">
    <h1>דשבורד הצבעה</h1>
    <a href="manager.html">חזרה</a>
  </div>

  <div class="card big">
    <div class="num"><span id="voted">–</span></div>
    <div class="of">הצביעו מתוך יעד של <b id="target">–</b> (80% מ־<span id="total">–</span> בעלי זכות בחירה)</div>
    <div class="barwrap">
      <div class="bar"><div id="fill"></div></div>
      <i class="mark" id="mark"></i><span class="marklbl" id="marklbl"></span>
    </div>
    <div class="of"><b id="pct">–</b> מהיעד · חסרים <b id="gap">–</b></div>
  </div>

  <div class="grid">
    <div class="card kpi"><div class="v" id="pctAll">–</div><div class="l">אחוז הצבעה מכלל הרשימה</div></div>
    <div class="card kpi"><div class="v" id="noans">–</div><div class="l">אין מענה</div></div>
    <div class="card kpi"><div class="v" id="pass">–</div><div class="l">דילגו</div></div>
    <div class="card kpi"><div class="v" id="prog">–</div><div class="l">בטיפול כרגע</div></div>
    <div class="card kpi"><div class="v" id="fresh">–</div><div class="l">טרם טופלו</div></div>
  </div>

  <div class="card">
    <div class="chartbox"><canvas id="chart"></canvas></div>
  </div>
  <div id="err"></div>
  <div id="upd"></div>
</main>

<script>
const API = 'https://script.google.com/macros/s/AKfycbwiTvKcGLOuDO238FPabknVv0wdkoPvRyFqgaP-6stp1dmuNGU_M4fgfH2KjOvgN8xQJg/exec';
const TEAM_CODE = 'SARID-8Q4K';
const REFRESH = Number(new URLSearchParams(location.search).get('r')) || 30;
const MIN = 60000;
const $ = (id) => document.getElementById(id);
let data = null, chart = null;

function hhmm(ms) { const d = new Date(ms); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }

// cumulative count at the end of each minute from startMs to endMs
function cumulative(times, startMs, endMs) {
  const sorted = times.slice().sort((a, b) => a - b);
  const out = [];
  let i = 0;
  for (let t = startMs; t <= endMs; t += MIN) {
    while (i < sorted.length && sorted[i] < t + MIN) i++;
    out.push(i);
  }
  return out;
}

function drawChart() {
  if (!data) return;
  const voted = data.votes || [], skipped = data.skips || [];
  const all = voted.concat(skipped);
  let labels = [], vSeries = [], sSeries = [];
  if (all.length) {
    const start = Math.floor(Math.min.apply(null, all) / MIN) * MIN;
    const end = Math.max(Math.floor(Date.now() / MIN) * MIN, start);
    for (let t = start; t <= end; t += MIN) labels.push(hhmm(t));
    vSeries = cumulative(voted, start, end);
    sSeries = cumulative(skipped, start, end);
  }
  const line = (label, d, color) => ({ label, data: d, borderColor: color, backgroundColor: color, borderWidth: 3, pointRadius: 0, pointHoverRadius: 4, tension: 0.2, fill: false });
  const cfg = {
    type: 'line',
    data: { labels, datasets: [line('הצביעו', vSeries, '#22c55e'), line('דילגו', sSeries, '#f59e0b')] },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { labels: { color: '#fff', font: { size: 14 } } } },
      scales: {
        x: { ticks: { color: '#cbd5e1', maxTicksLimit: 12, autoSkip: true }, grid: { color: 'rgba(255,255,255,.08)' } },
        y: { beginAtZero: true, ticks: { color: '#cbd5e1', precision: 0 }, grid: { color: 'rgba(255,255,255,.08)' } }
      }
    }
  };
  if (chart) chart.destroy();
  chart = new Chart($('chart'), cfg);
}

function render() {
  const c = data.counts, v = c.Voted || 0;
  $('voted').textContent = v; $('target').textContent = data.target; $('total').textContent = data.total;
  const pct = Math.min(100, Math.round(v / data.target * 100));
  // the bar shows votes against the whole list; the orange mark is the 80% target
  const tp = data.target / data.total * 100;
  $('fill').style.width = Math.min(100, v / data.total * 100) + '%';
  $('mark').style.right = tp + '%'; $('marklbl').style.right = tp + '%'; $('marklbl').textContent = 'יעד ' + data.target;
  $('pct').textContent = pct + '%';
  $('gap').textContent = Math.max(0, data.target - v);
  $('pctAll').textContent = Math.round(v / data.total * 100) + '%';
  $('noans').textContent = c.NoAnswer || 0; $('pass').textContent = c.Pass || 0;
  $('prog').textContent = c.InProgress || 0; $('fresh').textContent = c[''] || 0;
  drawChart();
}

async function load() {
  try {
    const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'stats', code: TEAM_CODE, name: 'dashboard' }) });
    const r = await res.json();
    if (!r.ok) throw new Error(r.error);
    data = r; $('err').textContent = ''; render();
    $('upd').textContent = 'עודכן ' + hhmm(Date.now()) + ' · מתרענן אוטומטית כל ' + REFRESH + ' שניות';
  } catch (e) { $('err').textContent = 'שגיאה בטעינת הנתונים: ' + e.message; }
}

load(); setInterval(load, REFRESH * 1000);
</script>
</body>
</html>
